# Local PostgreSQL for development. The API also runs on SQLite with no setup.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: littlego
      POSTGRES_PASSWORD: littlego
      POSTGRES_DB: littlego
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
