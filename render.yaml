# Render Blueprint for LittleGo.
# Render dashboard > New > Blueprint > choose the littlego repository.
# Render creates the database, API, dashboard and two scheduled jobs, and links them together.
# It asks only for the values marked `sync: false` (secrets and phone numbers).
# Times are UTC; Lagos is UTC+1.

databases:
  - name: littlego-db
    plan: basic-256mb
    region: frankfurt              # closest Render region to Lagos
    postgresMajorVersion: "16"

services:
  - type: web
    name: littlego-api
    runtime: docker
    region: frankfurt
    plan: starter
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: LITTLEGO_ENVIRONMENT
        value: production
      - key: LITTLEGO_DATABASE_URL
        fromDatabase: { name: littlego-db, property: connectionString }
      - key: LITTLEGO_JWT_SECRET
        generateValue: true
      - key: LITTLEGO_PIN_ENCRYPTION_KEY
        sync: false                # see DEPLOY.md: one command generates it; keep a copy safe
      - key: LITTLEGO_CORS_ORIGINS
        sync: false                # the dashboard's public address, e.g. https://littlego-dashboard.onrender.com
      - key: LITTLEGO_OPS_ALERT_PHONES
        sync: false                # e.g. 08031234567,08037654321
      - key: LITTLEGO_SMS_PROVIDER
        value: termii
      - key: LITTLEGO_TERMII_BASE_URL
        value: https://v4.api.termii.com
      - key: LITTLEGO_TERMII_API_KEY
        sync: false
      - key: LITTLEGO_TERMII_CHANNEL
        value: dnd                 # change to generic only until Termii enables DND
      - key: LITTLEGO_SMS_SENDER_ID
        value: LittleGo
      - key: LITTLEGO_PAYMENT_PROVIDER
        value: paystack
      - key: LITTLEGO_PAYSTACK_SECRET_KEY
        sync: false                # sk_test_... first

  - type: web
    name: littlego-dashboard
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false                # the API's public address, e.g. https://littlego-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: cron
    name: littlego-generate-trips
    runtime: docker
    region: frankfurt
    plan: starter
    rootDir: backend
    schedule: "0 4 * * 1-5"        # 05:00 Lagos, school days
    dockerCommand: python -m app.jobs generate-trips
    envVars:
      - key: LITTLEGO_ENVIRONMENT
        value: production
      - key: LITTLEGO_DATABASE_URL
        fromDatabase: { name: littlego-db, property: connectionString }
      - key: LITTLEGO_JWT_SECRET
        fromService: { type: web, name: littlego-api, envVarKey: LITTLEGO_JWT_SECRET }
      - key: LITTLEGO_PIN_ENCRYPTION_KEY
        fromService: { type: web, name: littlego-api, envVarKey: LITTLEGO_PIN_ENCRYPTION_KEY }
      - key: LITTLEGO_CORS_ORIGINS
        fromService: { type: web, name: littlego-api, envVarKey: LITTLEGO_CORS_ORIGINS }
      - key: LITTLEGO_OPS_ALERT_PHONES
        fromService: { type: web, name: littlego-api, envVarKey: LITTLEGO_OPS_ALERT_PHONES }
      - key: LITTLEGO_SMS_PROVIDER
        value: termii
      - key: LITTLEGO_TERMII_BASE_URL
        value: https://v4.api.termii.com
      - key: LITTLEGO_TERMII_API_KEY
        fromService: { type: web, name: littlego-api, envVarKey: LITTLEGO_TERMII_API_KEY }
      - key: LITTLEGO_TERMII_CHANNEL
        fromService: { type: web, name: littlego-api, envVarKey: LITTLEGO_TERMII_CHANNEL }
      - key: LITTLEGO_SMS_SENDER_ID
        value: LittleGo
      - key: LITTLEGO_PAYMENT_PROVIDER
        value: paystack
      - key: LITTLEGO_PAYSTACK_SECRET_KEY
        fromService: { type: web, name: littlego-api, envVarKey: LITTLEGO_PAYSTACK_SECRET_KEY }

  - type: cron
    name: littlego-watchdog
    runtime: docker
    region: frankfurt
    plan: starter
    rootDir: backend
    schedule: "*/5 5-17 * * 1-5"   # every 5 minutes, 06:00-18:59 Lagos
    dockerCommand: python -m app.jobs watchdog
    envVars:
      - key: LITTLEGO_ENVIRONMENT
        value: production
      - key: LITTLEGO_DATABASE_URL
        fromDatabase: { name: littlego-db, property: connectionString }
      - key: LITTLEGO_JWT_SECRET
        fromService: { type: web, name: littlego-api, envVarKey: LITTLEGO_JWT_SECRET }
      - key: LITTLEGO_PIN_ENCRYPTION_KEY
        fromService: { type: web, name: littlego-api, envVarKey: LITTLEGO_PIN_ENCRYPTION_KEY }
      - key: LITTLEGO_CORS_ORIGINS
        fromService: { type: web, name: littlego-api, envVarKey: LITTLEGO_CORS_ORIGINS }
      - key: LITTLEGO_OPS_ALERT_PHONES
        fromService: { type: web, name: littlego-api, envVarKey: LITTLEGO_OPS_ALERT_PHONES }
      - key: LITTLEGO_SMS_PROVIDER
        value: termii
      - key: LITTLEGO_TERMII_BASE_URL
        value: https://v4.api.termii.com
      - key: LITTLEGO_TERMII_API_KEY
        fromService: { type: web, name: littlego-api, envVarKey: LITTLEGO_TERMII_API_KEY }
      - key: LITTLEGO_TERMII_CHANNEL
        fromService: { type: web, name: littlego-api, envVarKey: LITTLEGO_TERMII_CHANNEL }
      - key: LITTLEGO_SMS_SENDER_ID
        value: LittleGo
      - key: LITTLEGO_PAYMENT_PROVIDER
        value: paystack
      - key: LITTLEGO_PAYSTACK_SECRET_KEY
        fromService: { type: web, name: littlego-api, envVarKey: LITTLEGO_PAYSTACK_SECRET_KEY }

