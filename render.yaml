# Render Blueprint: New > Blueprint > pick this repo. Render creates the database, API, dashboard and jobs.
# After the first deploy, fill in the secrets marked sync:false in the Render dashboard.
databases:
  - name: littlego-db
    plan: basic-256mb
    region: frankfurt          # closest Render region to Lagos
    postgresMajorVersion: "16"

services:
  - type: web
    name: littlego-api
    runtime: docker
    region: frankfurt
    plan: starter
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: LITTLEGO_ENVIRONMENT
        value: production
      - key: LITTLEGO_DATABASE_URL
        fromDatabase: { name: littlego-db, property: connectionString }
      - key: LITTLEGO_JWT_SECRET
        generateValue: true
      - key: LITTLEGO_PIN_ENCRYPTION_KEY
        sync: false
      - key: LITTLEGO_CORS_ORIGINS
        sync: false
      - key: LITTLEGO_OPS_ALERT_PHONES
        sync: false
      - key: LITTLEGO_SMS_PROVIDER
        value: termii
      - key: LITTLEGO_TERMII_API_KEY
        sync: false
      - key: LITTLEGO_TERMII_BASE_URL
        value: https://v4.api.termii.com
      - key: LITTLEGO_SMS_SENDER_ID
        sync: false
      - key: LITTLEGO_PAYMENT_PROVIDER
        value: paystack
      - key: LITTLEGO_PAYSTACK_SECRET_KEY
        sync: false
      - key: LITTLEGO_PASSWORD_LOGIN_ENABLED
        value: "true"

  - type: web
    name: littlego-dashboard
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false            # e.g. https://littlego-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Times are UTC. Lagos is UTC+1.
  - type: cron
    name: littlego-generate-trips
    runtime: docker
    region: frankfurt
    rootDir: backend
    schedule: "0 4 * * 1-5"    # 05:00 Lagos, school days
    dockerCommand: python -m app.jobs generate-trips
    envVars:
      - fromGroup: littlego-shared

  - type: cron
    name: littlego-watchdog
    runtime: docker
    region: frankfurt
    rootDir: backend
    schedule: "*/5 5-17 * * 1-5"   # every 5 minutes, 06:00-18:59 Lagos
    dockerCommand: python -m app.jobs watchdog
    envVars:
      - fromGroup: littlego-shared

envVarGroups:
  - name: littlego-shared
    envVars:
      - key: LITTLEGO_ENVIRONMENT
        value: production
      - key: LITTLEGO_DATABASE_URL
        sync: false            # paste the same internal database URL as the API
      - key: LITTLEGO_JWT_SECRET
        sync: false            # same value as the API
      - key: LITTLEGO_PIN_ENCRYPTION_KEY
        sync: false            # same value as the API
      - key: LITTLEGO_CORS_ORIGINS
        sync: false
      - key: LITTLEGO_SMS_PROVIDER
        value: termii
      - key: LITTLEGO_TERMII_API_KEY
        sync: false
      - key: LITTLEGO_PAYMENT_PROVIDER
        value: paystack
      - key: LITTLEGO_PAYSTACK_SECRET_KEY
        sync: false
